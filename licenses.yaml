  sdxl-1.0:          {licence: OpenRAIL++-M,      commercial: true,  verified_on: null}
  kokoro-82m:        {licence: Apache-2.0,        commercial: true,  verified_on: null,
                      open_question: "Does it ship usable Hindi voices? The dub plan depends on it."}
  faster-whisper:    {licence: MIT,               commercial: true,  verified_on: null}
  depth-anything-v2: {licence: Apache-2.0,        commercial: true,  verified_on: null}
  wan-2.2-5b-ti2v:   {licence: Apache-2.0,        commercial: true,  verified_on: null,
                      open_question: "Does the 5B TI2V variant fit 8 GB VRAM?"}
  pexels:            {licence: Pexels,            commercial: true,  verified_on: null}

forbidden:
  flux-dev:      {reason: "FLUX.1-dev Non-Commercial License"}
